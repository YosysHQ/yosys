name: Build environment setup
description: Configure build env for Yosys builds

inputs:
  runs-on:
    required: true
    type: string
  get-build-deps:
    description: 'Install Yosys build dependencies'
    default: false
    required: false
    type: boolean
  get-docs-deps:
    description: 'Install Yosys docs dependencies'
    default: false
    required: false
    type: boolean
  get-test-deps:
    description: 'Install Yosys test dependencies'
    default: false
    required: false
    type: boolean
  get-iverilog:
    description: 'Install iverilog'
    default: false
    required: false
    type: boolean

runs:
  using: composite
  steps:
    # if updating common/build/docs dependencies, make sure to update README.md
    # and docs/source/getting_started/installation.rst to match.
    - name: Linux common dependencies
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1.6.1
      with:
        packages: gawk git make python3
        version: ${{ inputs.runs-on }}-commonys

    - name: Linux build dependencies
      if: runner.os == 'Linux' && inputs.get-build-deps == 'true'
      uses: awalsh128/cache-apt-pkgs-action@v1.6.1
      with:
        packages: bison clang flex libffi-dev libfl-dev libreadline-dev pkg-config tcl-dev zlib1g-dev libgtest-dev libgmock-dev
        version: ${{ inputs.runs-on }}-buildys

    - name: Linux docs dependencies
      if: runner.os == 'Linux' && inputs.get-docs-deps == 'true'
      uses: awalsh128/cache-apt-pkgs-action@v1.6.1
      with:
        packages: graphviz xdot
        version: ${{ inputs.runs-on }}-docsys

    - name: Install macOS Dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install bison gawk libffi git pkg-config python3 bash googletest tcl-tk llvm

    - name: Install Homebrew flex 2.6.4_2
      if: runner.os == 'macOS'
      env:
        HOMEBREW_DEVELOPER: 1
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -m):$(sw_vers -productVersion | cut -d. -f1)" in
          arm64:26)
            tag=arm64_tahoe
            sha=62ca8b8763bc2c97fe3ec02a4f55e410a6bf80ab26c291b0914313a82d004afe
            ;;
          arm64:27)
            tag=arm64_golden_gate
            sha=c13235c5d79d815518424d61ded84ede60fcd46e8644493fa3cea9d546665220
            ;;
          *)
            echo '::error::No flex 2.6.4_2 bottle configured for this runner'
            exit 1
            ;;
        esac

        bottle="$RUNNER_TEMP/flex--2.6.4_2.$tag.bottle.tar.gz"
        token=$(curl -fsSL --retry 3 \
          'https://ghcr.io/token?service=ghcr.io&scope=repository:homebrew/core/flex:pull' \
          | jq -er '.token')

        curl -fsSL --retry 3 -H "Authorization: Bearer $token" \
          "https://ghcr.io/v2/homebrew/core/flex/blobs/sha256:$sha" -o "$bottle"
        printf '%s  %s\n' "$sha" "$bottle" | shasum -a 256 -c -

        (cd "$RUNNER_TEMP" && brew install --formula --no-ask "${bottle##*/}")

        flex_bin="$(brew --cellar flex)/2.6.4_2/bin"
        flex_version="$("$flex_bin/flex" --version)"
        if [[ "$flex_version" != "flex 2.6.4" ]]; then
          echo "::error::Expected flex 2.6.4, got $flex_version"
          exit 1
        fi
        printf '%s\n' "$flex_version"
        printf '%s\n' "$flex_bin" >> "$GITHUB_PATH"

    - name: Linux runtime environment
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "${{ github.workspace }}/.local/bin" >> $GITHUB_PATH
        echo "procs=$(nproc)" >> $GITHUB_ENV

    - name: macOS runtime environment
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "${{ github.workspace }}/.local/bin" >> $GITHUB_PATH
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
        # echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
        echo "procs=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    - name: Setup iverilog
      if: inputs.get-iverilog == 'true'
      uses: ./.github/actions/setup-iverilog
      with:
        runs-on: ${{ inputs.runs-on }}
