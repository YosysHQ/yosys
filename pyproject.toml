[build-system]
requires = [
	"wheel",
	"packaging",
	"pybind11>=3,<4",
	"cxxheaderparser>=1.4",
]
backend-path = ["pyosys/build"]
build-backend = "local_backend"

[tool.ruff]
target-version = "py310"
include = ["pyosys/*.py"]

[tool.ruff.lint]
select = ["I"]
ignore = [
	"F541", # f-string missing placeholders
	"W191" , # tab indentation
	"PLW0211", # first argument to staticmethod can't be cls
]

[tool.ruff.format]
indent-style = "tab"
